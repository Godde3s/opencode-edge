# opencode-edge — Cloudflare Workers configuration
# Deploy: npx wrangler deploy   (or paste worker.js into the dashboard)

name = "opencode-edge"
main = "worker.js"
compatibility_date = "2025-03-01"

# Required — comma separated list of client keys. Requests to /v1 are refused
# (503) while this is unset, so the worker can never be an open relay. Use a
# secret instead of [vars] if you prefer: `npx wrangler secret put API_KEYS`.
[vars]
API_KEYS = "change-me-to-a-long-random-string"

# Optional — alias incoming model names, e.g. "gpt-4o:deepseek-v4-flash-free":
# MODEL_MAP = "gpt-4o:deepseek-v4-flash-free"
